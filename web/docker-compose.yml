name: angibell360

# Página (Next.js) + Motor comercial (API) + Base de datos unificada (PostgreSQL 17).

services:
  # ---------- Base de datos unificada (PostgreSQL 17) ----------
  postgres:
    image: postgres:17-alpine
    container_name: angibell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-angibell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta scripts/start-demo.sh para generar la clave de PostgreSQL}
      POSTGRES_DB: ${POSTGRES_DB:-angibell360}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-angibell} -d $${POSTGRES_DB:-angibell360}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - angibell

  # ---------- Motor comercial (PostgreSQL, chatbot y pagos simulados) ----------
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: angibell-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "4000"
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-angibell}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-angibell360}}
      MEDIA_DIR: /app/.state/media
      WHATSAPP_BRIDGE_ENABLED: ${WHATSAPP_BRIDGE_ENABLED:-false}
      WPPCONNECT_SECRET_KEY: ${WPPCONNECT_SECRET_KEY:-}
      WPPCONNECT_BASE_URL: ${WPPCONNECT_BASE_URL:-http://host.docker.internal:21465}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANGIBELL_ADMIN_SERVICE_KEY: ${ANGIBELL_ADMIN_SERVICE_KEY:?Ejecuta scripts/start-demo.sh para crear la clave interna}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-}
      META_PANEL_RETURN_URL: ${META_PANEL_RETURN_URL:-http://localhost:${ANGIBELL_WEB_PORT:-3002}/panel}
      SALES_ADMIN_PHONE: ${SALES_ADMIN_PHONE:-51995992450}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
      META_PUBLISH_ENABLED: ${META_PUBLISH_ENABLED:-false}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
      META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY:-}
      META_INSTAGRAM_USER_ID: ${META_INSTAGRAM_USER_ID:-}
      META_ACCESS_TOKEN_FILE: /run/secrets/meta-instagram-token
      META_FACEBOOK_PAGE_ID: ${META_FACEBOOK_PAGE_ID:-}
      META_FACEBOOK_PAGE_TOKEN_FILE: /run/secrets/meta-facebook-page-token
    volumes:
      - ./data/api-media:/app/.state/media
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - angibell

  # ---------- Página de Angibell 360 ----------
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        ANGIBELL_API_URL: http://api:4000
    container_name: angibell-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ANGIBELL_WEB_PORT:-3002}:3000"
    environment:
      DATA_DIR: /data
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:?Ejecuta scripts/start-demo.sh para crear la clave local}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?Ejecuta scripts/start-demo.sh para crear una clave de panel local}
      ANGIBELL_ADMIN_SERVICE_KEY: ${ANGIBELL_ADMIN_SERVICE_KEY:?Ejecuta scripts/start-demo.sh para crear la clave interna}
      ANGIBELL_API_URL: http://api:4000
    volumes:
      - ./data:/data
      - ./data/api-media:/data/uploads
    networks:
      - angibell
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  angibell:
    driver: bridge
